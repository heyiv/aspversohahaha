<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050714">
  <title>SÍLABA ASPENEXO // JUNHO 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..800,0..100,0..1;1,9..144,400..800,0..100,0..1&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ============================================================
       DESIGN TOKENS — OKLCH (perceptually uniform)
       Subordinated to EGO_DESIGN_STUDIO regra 3.
       ============================================================ */
    :root {
      color-scheme: dark;
      /* DEFAULT = PINK_NOISE (primavera cyberpunk dawn) */
      --bg:           oklch(8% 0.02 280);   /* deep void */
      --bg-deep:      oklch(5% 0.015 280);  /* outer space */
      --surface:      oklch(13% 0.025 280); /* layer 1 */
      --tile-bg:      oklch(16% 0.03 280);  /* tile rest */
      --tile-bg-hov:  oklch(20% 0.04 280);
      --hairline:     oklch(35% 0.06 280);  /* glow border base */

      --ink:          oklch(96% 0.04 200);   /* cyan-tinted white */
      --ink-muted:    oklch(72% 0.06 200);
      --ink-soft:     oklch(50% 0.05 200);

      --tile-on:      oklch(70% 0.30 320);   /* hot magenta on-state */
      --tile-on-ink:  oklch(8% 0.02 280);

      --accent:       oklch(72% 0.27 320);   /* PINK_NOISE primary */
      --accent-2:     oklch(78% 0.20 200);   /* electric cyan */
      --accent-ink:   oklch(8% 0.02 280);
      --accent-hov:   oklch(78% 0.30 320);

      --cat-1: oklch(80% 0.22 70);    /* hot amber */
      --cat-2: oklch(75% 0.27 145);   /* toxic green */
      --cat-3: oklch(78% 0.20 215);   /* electric cyan */
      --cat-4: oklch(70% 0.30 320);   /* hot magenta */
      --cat-ink: oklch(8% 0.02 280);

      /* glow tokens */
      --glow-1:       0 0 24px oklch(72% 0.27 320 / 0.6);
      --glow-2:       0 0 40px oklch(70% 0.30 320 / 0.45);
      --glow-cyan:    0 0 16px oklch(78% 0.20 200 / 0.5);
      --glow-soft:    0 0 8px oklch(72% 0.06 200 / 0.3);

      /* spacing 4/8 grid */
      --s-1: 4px; --s-2: 8px;  --s-3: 12px; --s-4: 16px;
      --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px;

      /* type scale */
      --t-12: 0.75rem; --t-14: 0.875rem; --t-16: 1rem;
      --t-20: 1.25rem; --t-28: 1.75rem; --t-40: 2.5rem;

      /* radii — minimal, FUI prefere quadrado */
      --r-pill: 999px; --r-md: 4px; --r-lg: 6px;

      /* typography */
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-body:    "JetBrains Mono", ui-monospace, monospace;
      --font-soft:    "Bricolage Grotesque", ui-sans-serif, sans-serif;
      --font-mono:    "JetBrains Mono", ui-monospace, monospace;
    }

    /* ============================================================
       SEASON CORES — cada uma é uma 'core' do sistema neon
       PINK_NOISE | OVERLOAD | EMBER_CORE | ICE_CORE
       ============================================================ */
    html[data-season="verao"] {
      /* OVERLOAD — solar high-noon overdrive */
      --bg:        oklch(8% 0.02 60);
      --bg-deep:   oklch(5% 0.018 60);
      --surface:   oklch(13% 0.03 60);
      --tile-bg:   oklch(16% 0.04 60);
      --tile-bg-hov: oklch(20% 0.05 60);
      --hairline:  oklch(38% 0.08 60);

      --ink:       oklch(96% 0.05 90);
      --ink-muted: oklch(72% 0.08 90);
      --ink-soft:  oklch(50% 0.06 90);

      --tile-on:     oklch(78% 0.25 65);
      --tile-on-ink: oklch(8% 0.02 60);

      --accent:     oklch(75% 0.25 50);
      --accent-2:   oklch(78% 0.22 165);
      --accent-ink: oklch(8% 0.02 60);
      --accent-hov: oklch(80% 0.27 50);

      --cat-1: oklch(82% 0.22 90);    /* solar yellow */
      --cat-2: oklch(75% 0.27 165);   /* acid lime */
      --cat-3: oklch(78% 0.22 220);   /* pool */
      --cat-4: oklch(72% 0.28 30);    /* coral fluo */
      --cat-ink: oklch(8% 0.02 60);

      --glow-1:    0 0 24px oklch(75% 0.25 50 / 0.6);
      --glow-2:    0 0 40px oklch(72% 0.28 30 / 0.45);
      --glow-cyan: 0 0 16px oklch(78% 0.22 165 / 0.5);
    }

    html[data-season="outono"] {
      /* EMBER_CORE — molten reactor red */
      --bg:        oklch(8% 0.02 30);
      --bg-deep:   oklch(5% 0.02 30);
      --surface:   oklch(13% 0.03 30);
      --tile-bg:   oklch(16% 0.04 30);
      --tile-bg-hov: oklch(20% 0.05 30);
      --hairline:  oklch(35% 0.10 30);

      --ink:       oklch(95% 0.06 60);
      --ink-muted: oklch(72% 0.08 50);
      --ink-soft:  oklch(50% 0.06 50);

      --tile-on:     oklch(72% 0.27 30);
      --tile-on-ink: oklch(8% 0.02 30);

      --accent:     oklch(70% 0.27 25);
      --accent-2:   oklch(72% 0.20 80);
      --accent-ink: oklch(8% 0.02 30);
      --accent-hov: oklch(75% 0.29 25);

      --cat-1: oklch(75% 0.25 60);   /* ember orange */
      --cat-2: oklch(78% 0.22 90);   /* molten gold */
      --cat-3: oklch(70% 0.27 25);   /* burning red */
      --cat-4: oklch(60% 0.22 350);  /* deep crimson */
      --cat-ink: oklch(8% 0.02 30);

      --glow-1:    0 0 24px oklch(70% 0.27 25 / 0.7);
      --glow-2:    0 0 40px oklch(75% 0.25 60 / 0.5);
      --glow-cyan: 0 0 16px oklch(78% 0.22 90 / 0.5);
    }

    html[data-season="inverno"] {
      /* ICE_CORE — glacier subzero blue */
      --bg:        oklch(8% 0.015 240);
      --bg-deep:   oklch(5% 0.015 240);
      --surface:   oklch(13% 0.02 240);
      --tile-bg:   oklch(16% 0.025 240);
      --tile-bg-hov: oklch(20% 0.03 240);
      --hairline:  oklch(40% 0.10 240);

      --ink:       oklch(96% 0.04 220);
      --ink-muted: oklch(72% 0.06 220);
      --ink-soft:  oklch(50% 0.05 220);

      --tile-on:     oklch(80% 0.20 220);
      --tile-on-ink: oklch(8% 0.015 240);

      --accent:     oklch(72% 0.22 260);
      --accent-2:   oklch(78% 0.18 200);
      --accent-ink: oklch(8% 0.015 240);
      --accent-hov: oklch(78% 0.24 260);

      --cat-1: oklch(82% 0.15 200);   /* ice */
      --cat-2: oklch(75% 0.20 240);   /* deep ocean */
      --cat-3: oklch(78% 0.20 290);   /* aurora violet */
      --cat-4: oklch(80% 0.15 160);   /* mint frost */
      --cat-ink: oklch(8% 0.015 240);

      --glow-1:    0 0 24px oklch(72% 0.22 260 / 0.65);
      --glow-2:    0 0 40px oklch(78% 0.18 200 / 0.5);
      --glow-cyan: 0 0 16px oklch(78% 0.18 200 / 0.5);
    }


    /* ============================================================
       BASE — dark cyberpunk void
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      background: var(--bg-deep);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: var(--t-16);
      font-weight: 500;
      letter-spacing: 0.01em;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      touch-action: manipulation;
    }

    /* radial glow background */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--s-8) var(--s-4) var(--s-12);
      background:
        radial-gradient(ellipse at 50% 0%, oklch(from var(--accent) l c h / 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 30% 100%, oklch(from var(--accent-2) l c h / 0.18) 0%, transparent 50%),
        var(--bg-deep);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    /* scanlines overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      background: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 2px,
        oklch(0% 0 0 / 0.18) 2px,
        oklch(0% 0 0 / 0.18) 3px
      );
      mix-blend-mode: multiply;
    }

    /* grid pattern background */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image:
        linear-gradient(oklch(from var(--accent) l c h / 0.04) 1px, transparent 1px),
        linear-gradient(90deg, oklch(from var(--accent) l c h / 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 75%);
    }

    main, header, .season-row, footer { position: relative; z-index: 2; }

    /* ============================================================
       TYPOGRAPHY — Fraunces glow + JetBrains terminal
       ============================================================ */
    .display {
      font-family: var(--font-display);
      font-weight: 600;
      font-variation-settings: "opsz" 144, "SOFT" 30, "WONK" 1;
      letter-spacing: -0.02em;
      line-height: 0.95;
      color: var(--ink);
      text-shadow:
        0 0 1px oklch(from var(--accent) l c h / 0.6),
        0 0 12px oklch(from var(--accent) l c h / 0.4),
        0 0 32px oklch(from var(--accent) l c h / 0.2);
    }
    .display em {
      font-style: italic;
      font-weight: 700;
      font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
      color: var(--accent);
      text-shadow:
        0 0 2px oklch(from var(--accent) l c h / 0.8),
        0 0 16px oklch(from var(--accent) l c h / 0.6),
        0 0 40px oklch(from var(--accent) l c h / 0.4);
    }
    .lede {
      font-family: var(--font-soft);
      font-size: var(--t-14);
      color: var(--ink-muted);
      letter-spacing: 0.01em;
    }
    .caps {
      font-family: var(--font-mono);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.7rem;
      color: var(--ink-soft);
    }
    .caps-accent {
      color: var(--accent-2);
      text-shadow: var(--glow-cyan);
    }
    /* status bar — FUI readout */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      padding: var(--s-2) var(--s-3);
      margin-bottom: var(--s-5);
      border: 1px solid var(--hairline);
      background: oklch(from var(--surface) l c h / 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-soft);
      gap: var(--s-2);
    }
    .status-bar .pulse {
      display: inline-block;
      width: 7px; height: 7px;
      background: var(--accent-2);
      box-shadow: var(--glow-cyan);
      border-radius: 50%;
      margin-right: var(--s-2);
      animation: pulse-soft 2s ease-in-out infinite;
    }
    .status-bar span { white-space: nowrap; }
    @keyframes pulse-soft {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ============================================================
       HEADER META — FUI glass chips
       ============================================================ */
    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--s-3);
      background: oklch(from var(--surface) l c h / 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--hairline);
      border-radius: 0;
      padding: var(--s-2) var(--s-3);
      font-family: var(--font-mono);
      font-size: var(--t-14);
      color: var(--ink);
      position: relative;
    }
    .meta-chip::before, .meta-chip::after {
      content: "";
      position: absolute;
      width: 8px; height: 8px;
      border: 1px solid var(--accent-2);
      box-shadow: var(--glow-cyan);
    }
    .meta-chip::before {
      top: -1px; left: -1px;
      border-right: 0; border-bottom: 0;
    }
    .meta-chip::after {
      bottom: -1px; right: -1px;
      border-left: 0; border-top: 0;
    }
    .meta-chip label {
      color: var(--ink-soft);
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 500;
    }
    #seletor-dia {
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--accent-2);
      font-weight: 600;
      font-size: var(--t-14);
      cursor: pointer;
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
      text-shadow: var(--glow-cyan);
    }
    #seletor-dia option { background: var(--bg-deep); color: var(--ink); }

    .theme-chip {
      display: inline-block;
      padding: var(--s-2) var(--s-3);
      border-radius: 0;
      background: oklch(from var(--surface) l c h / 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--hairline);
      font-family: var(--font-mono);
      font-size: var(--t-14);
      color: var(--ink);
      font-weight: 500;
      position: relative;
    }
    .theme-chip::before, .theme-chip::after {
      content: "";
      position: absolute;
      width: 8px; height: 8px;
      border: 1px solid var(--accent);
      box-shadow: var(--glow-1);
    }
    .theme-chip::before {
      top: -1px; right: -1px;
      border-left: 0; border-bottom: 0;
    }
    .theme-chip::after {
      bottom: -1px; left: -1px;
      border-right: 0; border-top: 0;
    }
    .theme-chip strong {
      color: var(--ink-soft);
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.7rem;
      margin-right: var(--s-2);
    }
    .theme-chip span:not(.theme-chip strong) {
      color: var(--accent);
      text-shadow: 0 0 8px oklch(from var(--accent) l c h / 0.4);
    }


    /* ============================================================
       TILES — neon FUI cells
       ============================================================ */
    .tile {
      width: 100%;
      aspect-ratio: 1 / 1;
      min-height: 64px;
      border-radius: var(--r-md);
      background: oklch(from var(--tile-bg) l c h / 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--ink);
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: var(--t-16);
      letter-spacing: 0.04em;
      border: 1px solid var(--hairline);
      cursor: pointer;
      transition:
        background-color 180ms ease,
        transform 120ms ease,
        color 180ms ease,
        border-color 200ms ease,
        box-shadow 200ms ease;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      position: relative;
      text-transform: uppercase;
    }
    .tile:hover {
      background: oklch(from var(--tile-bg-hov) l c h / 0.85);
      border-color: var(--accent-2);
      box-shadow: 0 0 0 1px oklch(from var(--accent-2) l c h / 0.4) inset, var(--glow-cyan);
      color: var(--accent-2);
    }
    .tile:active { transform: scale(0.96); }
    .tile.is-on {
      background: oklch(from var(--tile-on) l c h / 0.95);
      color: var(--tile-on-ink);
      border-color: var(--tile-on);
      box-shadow:
        0 0 0 1px var(--tile-on) inset,
        var(--glow-1),
        var(--glow-2);
      animation: tile-pulse 2.4s ease-in-out infinite;
    }
    .tile.is-on:hover {
      background: oklch(from var(--tile-on) l c h / 1);
      color: var(--tile-on-ink);
    }

    @keyframes tile-pulse {
      0%, 100% { box-shadow: 0 0 0 1px var(--tile-on) inset, var(--glow-1), var(--glow-2); }
      50% { box-shadow: 0 0 0 1px var(--tile-on) inset, 0 0 32px oklch(from var(--tile-on) l c h / 0.8), 0 0 56px oklch(from var(--tile-on) l c h / 0.5); }
    }

    @media (min-width: 768px) {
      .tile { font-size: var(--t-20); min-height: 80px; }
    }

    /* ============================================================
       SOLVED CARDS — FUI bracket frame com glow
       ============================================================ */
    .solved {
      width: 100%;
      border-radius: var(--r-md);
      padding: var(--s-4) var(--s-5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--cat-ink);
      gap: var(--s-1);
      min-height: 80px;
      position: relative;
      box-shadow:
        0 0 0 1px oklch(from currentColor l c h / 0.0) inset,
        0 0 24px oklch(from currentColor l c h / 0.45),
        0 0 48px oklch(from currentColor l c h / 0.25);
    }
    .solved::before, .solved::after {
      content: "";
      position: absolute;
      width: 12px; height: 12px;
      border: 1.5px solid var(--cat-ink);
    }
    .solved::before {
      top: 6px; left: 6px;
      border-right: 0; border-bottom: 0;
    }
    .solved::after {
      bottom: 6px; right: 6px;
      border-left: 0; border-top: 0;
    }
    .solved .word {
      font-family: var(--font-display);
      font-weight: 700;
      font-style: italic;
      font-variation-settings: "opsz" 96, "SOFT" 80, "WONK" 1;
      font-size: var(--t-28);
      letter-spacing: -0.01em;
      line-height: 1;
    }
    .solved .syllables {
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 0.7rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    /* ============================================================
       LIVES + ACTIONS — FUI controls
       ============================================================ */
    .lives-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--s-3);
      color: var(--ink-soft);
    }
    .life-dot {
      width: 10px; height: 10px;
      border-radius: 0;
      background: var(--accent-2);
      box-shadow: var(--glow-cyan);
      transition: background-color 240ms ease, transform 200ms ease, box-shadow 240ms ease;
      transform: rotate(45deg);
    }
    .life-dot.lost {
      background: transparent;
      border: 1px solid var(--hairline);
      box-shadow: none;
      transform: rotate(45deg) scale(0.8);
    }

    .btn {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: var(--t-14);
      letter-spacing: 0.10em;
      text-transform: uppercase;
      padding: var(--s-3) var(--s-5);
      border-radius: 0;
      cursor: pointer;
      transition: all 200ms ease;
      border: 1px solid var(--hairline);
      background: oklch(from var(--surface) l c h / 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--ink);
      min-height: 44px;
      position: relative;
    }
    .btn:hover {
      border-color: var(--accent-2);
      color: var(--accent-2);
      box-shadow: var(--glow-cyan);
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      color: var(--ink-soft);
      border-color: var(--hairline);
    }
    .btn-primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      box-shadow: var(--glow-1);
    }
    .btn-primary:hover {
      background: var(--accent-hov);
      border-color: var(--accent-hov);
      color: var(--accent-ink);
      box-shadow: var(--glow-1), var(--glow-2);
    }
    .btn-primary:disabled {
      background: oklch(from var(--surface) l c h / 0.4);
      color: var(--ink-soft);
      border-color: var(--hairline);
    }
    .btn-accent {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      box-shadow: var(--glow-1);
    }
    .btn-accent:hover {
      background: var(--accent-hov);
      border-color: var(--accent-hov);
      color: var(--accent-ink);
      box-shadow: var(--glow-1), var(--glow-2);
    }

    :focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 2px;
      box-shadow: var(--glow-cyan);
    }


    /* ============================================================
       TOAST — terminal alert
       ============================================================ */
    #toast {
      visibility: hidden;
      position: fixed;
      left: 50%;
      bottom: var(--s-8);
      transform: translateX(-50%) translateY(20px);
      background: oklch(from var(--bg) l c h / 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--accent-2);

<script>
  // ============================================================
  // SISTEMA DE DATAS — preservado do v01
  // ============================================================
  const DATA_LANCAMENTO = new Date(2026, 4, 31); // 31 mai -> dia 1 = 1 jun
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  let diferencaDias = Math.floor((hoje.getTime() - DATA_LANCAMENTO.getTime()) / (1000 * 60 * 60 * 24));
  // Modo "amigos / GitHub Pages": todos os 30 dias liberados de uma vez.
  // (Pra voltar ao modo NYT-style 1-por-dia, troque pra: diferencaDias > 0 ? Math.min(diferencaDias, 30) : 1)
  let diaAtualMaximo = 30;
  let diaSugerido = Math.min(Math.max(diferencaDias, 1), 30);

  // ============================================================
  // ESTADO
  // ============================================================
  let numeroDoDiaSelecionado = diaSugerido;
  let faseAtualDados = [];
  let tilesAtivos = [];
  let tilesSelecionados = [];
  let categoriasResolvidas = [];
  let historicoTentativas = [];
  let vidas = 4;
  let jogoFinalizado = false;
  let vitoria = false;

  // ============================================================
  // DOM REFS
  // ============================================================
  const gridEl = document.getElementById('grid');
  const solvedContainerEl = document.getElementById('solved-container');
  const livesEl = document.getElementById('lives');
  const seletorDiaEl = document.getElementById('seletor-dia');
  const temaDisplayEl = document.getElementById('tema-display');
  const btnShuffle = document.getElementById('btn-shuffle');
  const btnDeselect = document.getElementById('btn-deselect');
  const btnSubmit = document.getElementById('btn-submit');
  const toastEl = document.getElementById('toast');
  const endScreenEl = document.getElementById('end-screen');
  const endTitleEl = document.getElementById('end-title');
  const endSubtitleEl = document.getElementById('end-subtitle');
  const emojiGridEl = document.getElementById('emoji-grid');
  const btnShare = document.getElementById('btn-share');
  const hiddenOnWinEls = document.querySelectorAll('.hidden-on-win');

  // ============================================================
  // INIT
  // ============================================================
  function carregarOpcoesDeDias() {
    seletorDiaEl.innerHTML = '';
    for (let i = 1; i <= diaAtualMaximo; i++) {
      const option = document.createElement('option');
      option.value = i;
      option.text = `Dia ${i}`;
      if (i === numeroDoDiaSelecionado) option.selected = true;
      seletorDiaEl.appendChild(option);
    }
    seletorDiaEl.addEventListener('change', (e) => {
      numeroDoDiaSelecionado = parseInt(e.target.value, 10);
      inicializarJogoParaDia();
    });
  }

  function inicializarJogoParaDia() {
    hiddenOnWinEls.forEach(el => { el.style.display = ''; });
    endScreenEl.classList.add('hidden');
    endScreenEl.style.display = 'none';

    faseAtualDados = BANCO_DE_FASES[numeroDoDiaSelecionado - 1].palavras;
    const tema = BANCO_DE_FASES[numeroDoDiaSelecionado - 1].tema;
    temaDisplayEl.innerHTML = `<strong>Tema</strong><span>${tema}</span>`;
    const dayNumEl = document.getElementById('status-day-num');
    if (dayNumEl) dayNumEl.textContent = String(numeroDoDiaSelecionado).padStart(3, '0');

    const dbSalvo = JSON.parse(localStorage.getItem('silabaAspenexo_v06_MultiDias')) || {};
    const estadoDoDia = dbSalvo[numeroDoDiaSelecionado];
    tilesSelecionados = [];

    if (estadoDoDia) {
      vidas = estadoDoDia.vidas;
      historicoTentativas = estadoDoDia.historicoTentativas;
      jogoFinalizado = estadoDoDia.jogoFinalizado;
      vitoria = estadoDoDia.vitoria;
      categoriasResolvidas = [];
      estadoDoDia.categoriasResolvidasNomes.forEach(nome => {
        const cat = faseAtualDados.find(c => c.palavra === nome);
        if (cat) categoriasResolvidas.push(cat);
      });
      tilesAtivos = estadoDoDia.tilesAtivosConfig;
    } else {
      vidas = 4;
      historicoTentativas = [];
      jogoFinalizado = false;
      vitoria = false;
      categoriasResolvidas = [];
      tilesAtivos = [];
      let idCounter = 0;
      faseAtualDados.forEach(categoria => {
        categoria.silabas.forEach(silaba => {
          tilesAtivos.push({ id: idCounter++, texto: silaba, selecionado: false });
        });
      });
      embaralharArray(tilesAtivos);
    }

    atualizarVidas();
    renderizar();
    if (jogoFinalizado) mostrarTelaFinal();
    else salvarEstado();
  }

  function salvarEstado() {
    const dbSalvo = JSON.parse(localStorage.getItem('silabaAspenexo_v06_MultiDias')) || {};
    dbSalvo[numeroDoDiaSelecionado] = {
      vidas,
      historicoTentativas,
      categoriasResolvidasNomes: categoriasResolvidas.map(c => c.palavra),
      tilesAtivosConfig: tilesAtivos.map(t => ({ ...t, selecionado: false })),
      jogoFinalizado,
      vitoria
    };
    localStorage.setItem('silabaAspenexo_v06_MultiDias', JSON.stringify(dbSalvo));
  }


  // ============================================================
  // LÓGICA DE JOGO
  // ============================================================
  function embaralharArray(array) {
    let i = array.length, j;
    while (i > 0) {
      j = Math.floor(Math.random() * i);
      i--;
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function embaralharEAtualizar() {
    embaralharArray(tilesAtivos);
    renderizar();
  }

  function toggleSelecao(tileId) {
    if (jogoFinalizado) return;
    const tile = tilesAtivos.find(t => t.id === tileId);
    if (!tile) return;
    if (tile.selecionado) {
      tile.selecionado = false;
      tilesSelecionados = tilesSelecionados.filter(t => t.id !== tileId);
    } else if (tilesSelecionados.length < 4) {
      tile.selecionado = true;
      tilesSelecionados.push(tile);
    }
    renderizar();
  }

  function desmarcarTodos() {
    tilesAtivos.forEach(t => { t.selecionado = false; });
    tilesSelecionados = [];
    renderizar();
  }

  function obterEmojiDaSilaba(texto) {
    for (const cat of faseAtualDados) {
      if (cat.silabas.includes(texto)) return cat.emoji;
    }
    return '⬛';
  }

  function submeterTentativa() {
    if (tilesSelecionados.length !== 4 || jogoFinalizado) return;
    const textosSelecionados = tilesSelecionados.map(t => t.texto);
    const linhaEmojis = textosSelecionados.map(t => obterEmojiDaSilaba(t)).sort().join('');
    historicoTentativas.push(linhaEmojis);

    let encontrou = false;
    let quaseLa = false;
    const sorteadosStr = [...textosSelecionados].sort().join('');

    for (const categoria of faseAtualDados) {
      if (categoriasResolvidas.includes(categoria)) continue;
      const catSilabasStr = [...categoria.silabas].sort().join('');
      if (sorteadosStr === catSilabasStr) {
        categoriasResolvidas.push(categoria);
        const idsSelecionados = tilesSelecionados.map(t => t.id);
        tilesAtivos = tilesAtivos.filter(t => !idsSelecionados.includes(t.id));
        tilesSelecionados = [];
        encontrou = true;
        animarAcertoEAtualizar();
        break;
      }
    }

    if (!encontrou) {
      for (const categoria of faseAtualDados) {
        if (categoriasResolvidas.includes(categoria)) continue;
        let intersec = 0;
        const tempSilabas = [...categoria.silabas];
        for (const texto of textosSelecionados) {
          const idx = tempSilabas.indexOf(texto);
          if (idx !== -1) { intersec++; tempSilabas.splice(idx, 1); }
        }
        if (intersec === 3) quaseLa = true;
      }
      vidas--;
      atualizarVidas();
      if (vidas > 0) {
        animarErro();
        mostrarToast(quaseLa ? 'Faltou apenas uma sílaba!' : 'Combinação incorreta');
        salvarEstado();
      } else {
        derrota();
      }
    }
  }

  function verificarVitoria() {
    if (categoriasResolvidas.length === faseAtualDados.length) {
      jogoFinalizado = true;
      vitoria = true;
      salvarEstado();
      mostrarTelaFinal();
    } else {
      salvarEstado();
    }
  }

  function derrota() {
    jogoFinalizado = true;
    vitoria = false;
    animarErro();
    mostrarToast('Fim de jogo');
    setTimeout(() => {
      faseAtualDados.forEach(cat => {
        if (!categoriasResolvidas.includes(cat)) categoriasResolvidas.push(cat);
      });
      tilesAtivos = [];
      tilesSelecionados = [];
      renderizar();
      salvarEstado();
      mostrarTelaFinal();
    }, 1000);
  }


  // ============================================================
  // RENDER + UI
  // ============================================================
  function renderizar() {
    solvedContainerEl.innerHTML = '';
    categoriasResolvidas.forEach(cat => {
      const div = document.createElement('div');
      div.className = 'solved' + (jogoFinalizado ? '' : ' bounce-in');
      div.style.backgroundColor = cat.cor;
      const word = document.createElement('span');
      word.className = 'word';
      word.textContent = cat.palavra;
      const syll = document.createElement('span');
      syll.className = 'syllables';
      syll.textContent = cat.silabas.join(' · ');
      div.appendChild(word);
      div.appendChild(syll);
      solvedContainerEl.appendChild(div);
    });

    gridEl.innerHTML = '';
    tilesAtivos.forEach(tile => {
      const btn = document.createElement('button');
      btn.className = 'tile' + (tile.selecionado ? ' is-on' : '');
      btn.type = 'button';
      btn.setAttribute('aria-pressed', tile.selecionado ? 'true' : 'false');
      btn.textContent = tile.texto;
      btn.onclick = () => toggleSelecao(tile.id);
      gridEl.appendChild(btn);
    });

    btnDeselect.disabled = tilesSelecionados.length === 0;
    btnSubmit.disabled = tilesSelecionados.length !== 4;
  }

  function atualizarVidas() {
    const dots = livesEl.querySelectorAll('.life-dot');
    dots.forEach((dot, index) => {
      if (index < vidas) dot.classList.remove('lost');
      else dot.classList.add('lost');
    });
  }

  function mostrarTelaFinal() {
    hiddenOnWinEls.forEach(el => { el.style.display = 'none'; });
    endScreenEl.classList.remove('hidden');
    endScreenEl.style.display = 'flex';

    if (vitoria) {
      endTitleEl.innerHTML = 'Parabéns <em>Caio</em>, venceu de novo';
      endTitleEl.className = 'end-title win';
      endSubtitleEl.textContent = 'Seu nome não é Caio? Ou você roubou o Caio, ou ele se encontra chapado demais neste momento para ter condições de jogar.';
    } else {
      endTitleEl.innerHTML = 'Não foi <em>dessa vez</em>';
      endTitleEl.className = 'end-title';
      endSubtitleEl.textContent = 'Tente outro dia anterior no menu superior.';
    }

    emojiGridEl.innerHTML = '';
    historicoTentativas.forEach(linha => {
      const p = document.createElement('p');
      p.textContent = linha;
      emojiGridEl.appendChild(p);
    });
  }

  let toastTimeout;
  function mostrarToast(mensagem) {
    toastEl.textContent = mensagem;
    toastEl.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  function animarErro() {
    const botoes = gridEl.querySelectorAll('button');
    tilesAtivos.forEach((tile, index) => {
      if (tile.selecionado && botoes[index]) {
        botoes[index].classList.add('shake');
        setTimeout(() => botoes[index].classList.remove('shake'), 360);
      }
    });
  }

  function animarAcertoEAtualizar() {
    renderizar();
    setTimeout(verificarVitoria, 500);
  }

  // ============================================================
  // SHARE
  // ============================================================
  btnShare.addEventListener('click', async () => {
    let texto = `Sílaba Aspenexo · Junho Dia ${numeroDoDiaSelecionado}\n\n`;
    historicoTentativas.forEach(linha => { texto += linha + '\n'; });
    texto += `\nhttps://heyiv.github.io/aspversohahaha/`;
    try {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (navigator.share && isMobile) {
        await navigator.share({ title: 'Sílaba Aspenexo', text: texto });
      } else {
        const ta = document.createElement('textarea');
        ta.value = texto;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        mostrarToast('Copiado para a área de transferência');
      }
    } catch (err) {
      mostrarToast('Erro ao compartilhar');
    }
  });

  btnShuffle.addEventListener('click', embaralharEAtualizar);
  btnDeselect.addEventListener('click', desmarcarTodos);
  btnSubmit.addEventListener('click', submeterTentativa);

  // ============================================================
  // SEASON SELECTOR — 4 paletas OKLCH
  // ============================================================
  const SEASONS = ['primavera', 'verao', 'outono', 'inverno'];
  const SEASON_KEY = 'silabaAspenexo_v06_season';

  function detectarEstacaoPorData() {
    // Hemisfério Norte (Tóquio JST). Mar-Mai primavera, Jun-Ago verão,
    // Set-Nov outono, Dez-Fev inverno.
    const m = new Date().getMonth(); // 0=jan
    if (m >= 2 && m <= 4) return 'primavera';
    if (m >= 5 && m <= 7) return 'verao';
    if (m >= 8 && m <= 10) return 'outono';
    return 'inverno';
  }

  const SEASON_MODES = {
    primavera: 'PINK_NOISE',
    verao:     'OVERLOAD',
    outono:    'EMBER_CORE',
    inverno:   'ICE_CORE'
  };

  function aplicarEstacao(season) {
    if (!SEASONS.includes(season)) season = 'primavera';
    document.documentElement.setAttribute('data-season', season);
    document.querySelectorAll('.season-pill').forEach(btn => {
      btn.setAttribute('aria-pressed', btn.dataset.season === season ? 'true' : 'false');
    });
    const modeEl = document.getElementById('status-mode');
    if (modeEl) modeEl.textContent = SEASON_MODES[season];
    localStorage.setItem(SEASON_KEY, season);
  }

  function inicializarSeletorEstacao() {
    const salva = localStorage.getItem(SEASON_KEY);
    const inicial = salva && SEASONS.includes(salva) ? salva : detectarEstacaoPorData();
    aplicarEstacao(inicial);
    document.querySelectorAll('.season-pill').forEach(btn => {
      btn.addEventListener('click', () => aplicarEstacao(btn.dataset.season));
    });
  }

  window.addEventListener('load', () => {
    carregarOpcoesDeDias();
    inicializarJogoParaDia();
    inicializarSeletorEstacao();
  });
</script>
